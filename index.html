<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Jadwal & Prediksi Bola</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: #0a0e1a;
    color: #e8eaf0;
    min-height: 100vh;
    padding: 20px;
  }
  .header {
    text-align: center;
    padding: 30px 20px;
    border-bottom: 1px solid #1e2536;
    margin-bottom: 30px;
  }
  .header h1 {
    font-size: 28px;
    font-weight: 800;
    letter-spacing: -0.5px;
    background: linear-gradient(135deg, #00d4ff, #7c3aed);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .header p {
    color: #6b7280;
    font-size: 14px;
    margin-top: 8px;
  }
  .container { max-width: 900px; margin: 0 auto; }
  .loading {
    text-align: center;
    padding: 60px 20px;
    color: #6b7280;
  }
  .loading .spinner {
    width: 40px;
    height: 40px;
    border: 3px solid #1f2937;
    border-top-color: #00d4ff;
    border-radius: 50%;
    animation: spin 1s linear infinite;
    margin: 0 auto 20px;
  }
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  .error {
    background: #7f1d1d;
    color: #fca5a5;
    padding: 16px;
    border-radius: 12px;
    text-align: center;
    font-size: 14px;
  }
  .league {
    background: #111827;
    border: 1px solid #1f2937;
    border-radius: 16px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .league-title {
    font-size: 16px;
    font-weight: 700;
    color: #00d4ff;
    margin-bottom: 16px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .match {
    background: #0a0e1a;
    border-radius: 12px;
    padding: 16px;
    margin-bottom: 10px;
  }
  .match:last-child { margin-bottom: 0; }
  .match-row {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .teams { flex: 1; }
  .team {
    font-size: 15px;
    font-weight: 600;
    margin-bottom: 4px;
  }
  .team:last-child { margin-bottom: 0; }
  .match-info {
    text-align: right;
    font-size: 13px;
    color: #6b7280;
  }
  .status {
    display: inline-block;
    padding: 3px 10px;
    border-radius: 20px;
    font-size: 11px;
    font-weight: 700;
    text-transform: uppercase;
    margin-bottom: 6px;
  }
  .status.upcoming { background: #1e3a5f; color: #60a5fa; }
  .status.live { background: #7f1d1d; color: #fca5a5; }
  .status.ft { background: #1f2937; color: #9ca3af; }
  .date {
    font-size: 12px;
    color: #6b7280;
    margin-top: 4px;
  }
  .stats {
    text-align: center;
    padding: 20px;
    color: #6b7280;
    font-size: 13px;
    margin-top: 20px;
  }
</style>
</head>
<body>
<div class="container">
  <div class="header">
    <h1>⚽ JADWAL & PREDIKSI</h1>
    <p>Data pertandingan terbaru</p>
  </div>

  <div id="content">
    <div class="loading">
      <div class="spinner"></div>
      <div>Memuat data pertandingan...</div>
    </div>
  </div>

  <div class="stats" id="stats"></div>
</div>

<script>
  const WORKER_URL = "https://bola-api.rehantobing31.workers.dev";

  async function loadMatches() {
    const content = document.getElementById('content');
    const stats = document.getElementById('stats');

    try {
      const response = await fetch(WORKER_URL);
      const data = await response.json();

      if (data.error) {
        content.innerHTML = '<div class="error">⚠️ ' + data.error + '</div>';
        return;
      }

      const events = data.results || [];

      if (events.length === 0) {
        content.innerHTML = '<div class="error">Belum ada data pertandingan.</div>';
        return;
      }

      let html = '';

      events.slice(0, 30).forEach(function(event) {
        const status = event.status || 'upcoming';
        let statusLabel = 'Upcoming';
        let statusClass = 'upcoming';

        if (status === 'live' || status === 'inprogress') {
          statusLabel = '🔴 Live';
          statusClass = 'live';
        } else if (status === 'finished' || status === 'ft') {
          statusLabel = 'FT';
          statusClass = 'ft';
        }

        let dateStr = '';
        if (event.event_date) {
          const d = new Date(event.event_date);
          dateStr = d.toLocaleDateString('id-ID', {
            day: 'numeric',
            month: 'short',
            year: 'numeric',
            hour: '2-digit',
            minute: '2-digit'
          });
        }

        html += '<div class="match">';
        html += '<div class="match-row">';
        html += '<div class="teams">';
        html += '<div class="team">' + (event.home_team || 'TBD') + '</div>';
        html += '<div class="team">' + (event.away_team || 'TBD') + '</div>';
        html += '</div>';
        html += '<div class="match-info">';
        html += '<div class="status ' + statusClass + '">' + statusLabel + '</div>';
        html += '<div class="date">' + dateStr + '</div>';
        html += '</div>';
        html += '</div>';
        html += '</div>';
      });

      content.innerHTML = '<div class="league">' +
        '<div class="league-title">⚽ PERTANDINGAN TERBARU</div>' +
        html + '</div>';

      stats.textContent = 'Total ' + (data.count || events.length) + ' pertandingan tersedia';

    } catch (error) {
      content.innerHTML = '<div class="error">⚠️ Gagal memuat data: ' + error.message + '</div>';
    }
  }

  loadMatches();
</script>
</body>
</html>
