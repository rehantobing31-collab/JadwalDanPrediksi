<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JadwalBolaPrediksi - Jadwal & Prediksi Bola Akurat</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0606;
    --bg-card: #141010;
    --bg-card-hover: #1e1616;
    --red: #ff3b30;
    --orange: #ff9500;
    --green: #22c55e;
    --text: #f5f0eb;
    --text-dim: #8a7f7a;
    --border: #2a1f1f;
  }
  body.light {
    --bg: #f5f5f7;
    --bg-card: #ffffff;
    --bg-card-hover: #f0f0f2;
    --text: #1a1a1a;
    --text-dim: #6b6b6b;
    --border: #e0e0e0;
  }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
    transition: background 0.3s, color 0.3s;
  }
  .topbar {
    padding: 12px 20px;
    display: flex;
    justify-content: space-between;
    align-items: center;
    max-width: 1400px;
    margin: 0 auto;
  }
  .brand-mini {
    display: flex; align-items: center; gap: 8px;
    font-size: 13px; font-weight: 800;
  }
  .brand-mini svg { width: 28px; height: 28px; }
  .top-actions { display: flex; gap: 8px; }
  .btn-icon {
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--text); width: 34px; height: 34px;
    border-radius: 10px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    font-size: 15px; transition: all 0.2s;
  }
  .btn-icon:hover { border-color: var(--red); }

  /* HERO */
  .hero-big {
    text-align: center;
    padding: 50px 20px 40px;
    position: relative;
    overflow: hidden;
  }
  .hero-big::before {
    content: '';
    position: absolute;
    top: 0; left: 50%; transform: translateX(-50%);
    width: 600px; height: 300px;
    background: radial-gradient(circle, rgba(255,59,48,0.12) 0%, transparent 70%);
    pointer-events: none;
  }
  .hero-big h1 {
    font-size: clamp(32px, 6vw, 56px);
    font-weight: 900;
    letter-spacing: -1.5px;
    line-height: 1;
    margin-bottom: 18px;
    position: relative;
  }
  .hero-big h1 .accent {
    background: linear-gradient(135deg, var(--red), var(--orange));
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    display: inline-block;
  }
  .hero-big .cursor {
    display: inline-block;
    width: 4px;
    height: 40px;
    background: var(--red);
    margin-left: 4px;
    vertical-align: middle;
    animation: blink 1s infinite;
  }
  @keyframes blink {
    0%, 50% { opacity: 1; }
    51%, 100% { opacity: 0; }
  }
  .hero-big p {
    color: var(--text-dim);
    font-size: 14px;
    max-width: 600px;
    margin: 0 auto 28px;
    position: relative;
  }
  .hero-big p strong {
    color: var(--red);
    font-weight: 800;
  }
  .hero-stats-big {
    display: flex;
    justify-content: center;
    gap: 14px;
    flex-wrap: wrap;
    margin-bottom: 24px;
    position: relative;
  }
  .stat-big {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 18px 32px;
    min-width: 110px;
  }
  .stat-big .num {
    font-size: 26px;
    font-weight: 900;
    color: var(--text);
    letter-spacing: -0.5px;
  }
  .stat-big .label {
    font-size: 11px;
    color: var(--text-dim);
    margin-top: 2px;
    font-weight: 600;
  }
  .hero-actions {
    display: flex;
    justify-content: center;
    gap: 10px;
    flex-wrap: wrap;
    position: relative;
  }
  .hero-pill {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: var(--bg-card);
    border: 1px solid var(--border);
    color: var(--text);
    padding: 8px 16px;
    border-radius: 22px;
    font-size: 12px;
    font-weight: 700;
    cursor: pointer;
    transition: all 0.2s;
  }
  .hero-pill:hover {
    border-color: var(--red);
    background: var(--bg-card-hover);
  }
  .hero-pill.live {
    color: var(--red);
    border-color: rgba(255,59,48,0.4);
    background: rgba(255,59,48,0.08);
  }
  .hero-pill .dot-live {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--red);
    animation: pulse 1.5s infinite;
  }
  @keyframes pulse {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.3; }
  }
  .hero-pill.hot {
    color: var(--orange);
    border-color: rgba(255,149,0,0.4);
    background: rgba(255,149,0,0.08);
  }

  .container { max-width: 1400px; margin: 0 auto; padding: 20px; }

  /* SECTION */
  .section-title {
    font-size: 18px;
    font-weight: 800;
    margin: 24px 0 14px;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .section-title::before {
    content: '';
    width: 4px; height: 20px;
    background: linear-gradient(180deg, var(--red), var(--orange));
    border-radius: 2px;
  }

  /* HOT SCROLL */
  .hot-scroll {
    display: flex;
    gap: 14px;
    overflow-x: auto;
    padding-bottom: 12px;
    margin-bottom: 24px;
    scrollbar-width: thin;
    scrollbar-color: var(--red) transparent;
  }
  .hot-scroll::-webkit-scrollbar { height: 6px; }
  .hot-scroll::-webkit-scrollbar-thumb { background: var(--red); border-radius: 3px; }

  /* MATCH CARD */
  .match-card {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 14px;
    padding: 14px;
    min-width: 240px;
    flex-shrink: 0;
    transition: all 0.2s;
    cursor: pointer;
  }
  .match-card:hover {
    border-color: var(--red);
    transform: translateY(-2px);
    background: var(--bg-card-hover);
  }
  .mc-top {
    display: flex;
    justify-content: space-between;
    align-items: center;
    margin-bottom: 12px;
    font-size: 10px;
    color: var(--text-dim);
    font-weight: 600;
  }
  .hdp-badge {
    background: rgba(255,59,48,0.15);
    color: var(--red);
    padding: 3px 8px;
    border-radius: 6px;
    font-weight: 800;
    font-size: 10px;
    letter-spacing: 0.3px;
  }
  .mc-league {
    font-size: 10px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.4px;
    margin-bottom: 10px;
    font-weight: 700;
  }
  .mc-teams {
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    margin-bottom: 12px;
  }
  .mc-team {
    flex: 1;
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 5px;
    text-align: center;
  }
  .mc-team .logo {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: #fff;
    object-fit: contain;
    padding: 2px;
  }
  .mc-team .logo-fallback {
    width: 32px; height: 32px;
    border-radius: 50%;
    background: linear-gradient(135deg, var(--red), var(--orange));
    display: flex; align-items: center; justify-content: center;
    color: white; font-size: 11px; font-weight: 800;
  }
  .mc-team .name {
    font-size: 11px;
    font-weight: 700;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
    max-width: 90px;
  }
  .mc-vs {
    font-size: 10px;
    font-weight: 800;
    color: var(--text-dim);
    flex-shrink: 0;
  }
  .mc-pred {
    background: rgba(255,59,48,0.06);
    border: 1px solid rgba(255,59,48,0.15);
    border-radius: 8px;
    padding: 7px 10px;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  .mc-pred-label {
    font-size: 9px;
    color: var(--text-dim);
    text-transform: uppercase;
    letter-spacing: 0.3px;
    font-weight: 700;
  }
  .mc-pred-score {
    font-size: 13px;
    font-weight: 900;
    color: var(--red);
  }
  .mc-pred-score.live {
    color: var(--green);
  }

  /* LIST */
  .list-controls {
    display: flex;
    gap: 8px;
    margin-bottom: 14px;
    flex-wrap: wrap;
  }
  .search-wrap {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 9px 14px;
    display: flex; align-items: center; gap: 10px;
    flex: 1;
    min-width: 200px;
  }
  .search-wrap svg { width: 16px; height: 16px; fill: var(--text-dim); }
  .search-wrap input {
    background: none; border: none; outline: none;
    color: var(--text); font-size: 13px; width: 100%;
  }
  .search-wrap input::placeholder { color: var(--text-dim); }
  .filters { display: flex; gap: 6px; flex-wrap: wrap; }
  .filter-btn {
    background: var(--bg-card); border: 1px solid var(--border);
    color: var(--text-dim); font-size: 12px; font-weight: 700;
    padding: 8px 14px; border-radius: 10px; cursor: pointer;
    transition: all 0.2s;
  }
  .filter-btn.active {
    background: linear-gradient(135deg, var(--red), var(--orange));
    color: white; border-color: transparent;
  }

  .list-wrap {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
    margin-bottom: 20px;
  }
  .league-group { border-bottom: 1px solid var(--border); }
  .league-group:last-child { border-bottom: none; }
  .league-title {
    padding: 10px 18px;
    background: rgba(255,59,48,0.05);
    font-size: 11px;
    font-weight: 800;
    color: var(--orange);
    text-transform: uppercase;
    letter-spacing: 0.5px;
    display: flex;
    justify-content: space-between;
  }
  .match-row {
    padding: 12px 18px;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    display: flex;
    align-items: center;
    gap: 14px;
    transition: background 0.2s;
    cursor: pointer;
  }
  body.light .match-row { border-bottom-color: rgba(0,0,0,0.05); }
  .match-row:hover { background: var(--bg-card-hover); }
  .match-row:last-child { border-bottom: none; }
  .mr-time {
    min-width: 50px;
    text-align: center;
    flex-shrink: 0;
  }
  .mr-time .time { font-size: 12px; font-weight: 700; }
  .mr-time .date { font-size: 10px; color: var(--text-dim); }
  .mr-time.live .time { color: var(--red); }
  .mr-time.live .date { color: var(--red); }
  .mr-teams { flex: 1; min-width: 0; }
  .mr-team {
    display: flex;
    align-items: center;
    gap: 8px;
    margin-bottom: 6px;
  }
  .mr-team:last-child { margin-bottom: 0; }
  .mr-team .logo {
    width: 20px; height: 20px; border-radius: 50%;
    background: #fff; object-fit: contain; padding: 1px;
    flex-shrink: 0;
  }
  .mr-team .logo-fallback {
    width: 20px; height: 20px; border-radius: 50%;
    background: linear-gradient(135deg, var(--red), var(--orange));
    display: flex; align-items: center; justify-content: center;
    font-size: 8px; font-weight: 800; color: white;
    flex-shrink: 0;
  }
  .mr-team .name {
    font-size: 13px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .mr-score {
    min-width: 40px; text-align: right;
    display: flex; flex-direction: column; gap: 6px;
    flex-shrink: 0;
  }
  .mr-score .line {
    font-size: 14px; font-weight: 800;
  }
  .mr-score .line.live { color: var(--red); }
  .mr-score .line.empty { color: var(--text-dim); font-size: 12px; }

  /* Loading & states */
  .loading { text-align: center; padding: 50px 20px; color: var(--text-dim); font-size: 13px; }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--border); border-top-color: var(--red);
    border-radius: 50%; animation: spin 1s linear infinite;
    margin: 0 auto 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error {
    background: rgba(255,59,48,0.1); border: 1px solid var(--red);
    color: var(--red); padding: 14px; border-radius: 10px;
    text-align: center; font-size: 13px; margin: 20px;
  }
  .empty { text-align: center; padding: 40px 20px; color: var(--text-dim); font-size: 13px; }
  .last-update { text-align: center; color: var(--text-dim); font-size: 11px; padding: 16px 0; }

  /* Modal */
  .modal-bg {
    display: none; position: fixed; inset: 0;
    background: rgba(0,0,0,0.85); z-index: 999;
    align-items: center; justify-content: center;
    padding: 20px; backdrop-filter: blur(4px);
  }
  .modal-bg.show { display: flex; }
  .modal {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    max-width: 440px;
    width: 100%;
    max-height: 90vh;
    overflow-y: auto;
  }
  .modal-head {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
  }
  .modal-head h3 { font-size: 14px; font-weight: 800; }
  .modal-close {
    background: none; border: none; color: var(--text-dim);
    font-size: 24px; cursor: pointer; line-height: 1;
  }
  .modal-body { padding: 18px; }
  .modal-league {
    font-size: 11px; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.5px;
    margin-bottom: 14px; text-align: center; font-weight: 700;
  }
  .modal-teams {
    display: flex; justify-content: space-between; align-items: center;
    gap: 14px; margin-bottom: 18px;
  }
  .modal-team { flex: 1; text-align: center; }
  .modal-team .logo { width: 46px; height: 46px; margin: 0 auto 8px; display: block; object-fit: contain; }
  .modal-team .logo-fallback { width: 46px; height: 46px; margin: 0 auto 8px; font-size: 15px; }
  .modal-team .name { font-size: 12px; font-weight: 700; }
  .modal-vs { font-size: 18px; font-weight: 900; color: var(--red); }
  .modal-info {
    background: rgba(255,255,255,0.03); border-radius: 10px;
    padding: 12px; margin-bottom: 10px;
  }
  body.light .modal-info { background: rgba(0,0,0,0.03); }
  .modal-info-row {
    display: flex; justify-content: space-between;
    font-size: 12px; padding: 5px 0;
  }
  .modal-info-row .label { color: var(--text-dim); }
  .modal-info-row .value { font-weight: 700; }

  @media (max-width: 600px) {
    .hero-big { padding: 30px 16px 24px; }
    .stat-big { padding: 14px 22px; min-width: 90px; }
    .stat-big .num { font-size: 20px; }
  }
</style>
</head>
<body>

<div class="topbar">
  <div class="brand-mini">
    <svg viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#ff3b30"/>
          <stop offset="100%" stop-color="#ff9500"/>
        </linearGradient>
      </defs>
      <circle cx="50" cy="50" r="45" fill="url(#g1)"/>
      <path d="M50 20 L60 40 L80 40 L65 55 L70 75 L50 62 L30 75 L35 55 L20 40 L40 40 Z" fill="white"/>
    </svg>
    <span>JadwalBolaPrediksi</span>
  </div>
  <div class="top-actions">
    <button class="btn-icon" id="btnRefresh" title="Refresh">🔄</button>
    <button class="btn-icon" id="btnTheme" title="Tema">🌙</button>
  </div>
</div>

<div class="hero-big">
  <h1>JADWAL & PREDIKSI<br><span class="accent">BOLA AKURAT</span><span class="cursor"></span></h1>
  <p>Temukan jadwal, pasaran <strong>HDP</strong>, dan prediksi skor terbaru hanya di <strong>JadwalBolaPrediksi</strong>.</p>
  <div class="hero-stats-big">
    <div class="stat-big">
      <div class="num" id="statMatches">-</div>
      <div class="label">Jadwal</div>
    </div>
    <div class="stat-big">
      <div class="num" id="statPrediksi">-</div>
      <div class="label">Prediksi</div>
    </div>
    <div class="stat-big">
      <div class="num" id="statLeagues">-</div>
      <div class="label">Liga</div>
    </div>
  </div>
  <div class="hero-actions">
    <div class="hero-pill live"><span class="dot-live"></span> Live Update</div>
    <div class="hero-pill hot">🔥 Hot Big Match</div>
  </div>
</div>

<div class="container">
  <div class="section-title">🔥 Pertandingan Spesial</div>
  <div class="hot-scroll" id="hotScroll">
    <div class="loading"><div class="spinner"></div>Memuat...</div>
  </div>

  <div class="section-title">📅 Jadwal Bola Terbaru</div>
  <div class="list-controls">
    <div class="search-wrap">
      <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
      <input type="text" id="searchInput" placeholder="Cari nama tim atau liga...">
    </div>
    <div class="filters">
      <button class="filter-btn active" data-filter="all">Semua</button>
      <button class="filter-btn" data-filter="LIVE">🔴 Live</button>
      <button class="filter-btn" data-filter="UPCOMING">Upcoming</button>
      <button class="filter-btn" data-filter="FT">FT</button>
    </div>
  </div>

  <div class="list-wrap" id="listWrap">
    <div class="loading"><div class="spinner"></div>Memuat jadwal...</div>
  </div>

  <div class="last-update" id="lastUpdate"></div>
</div>

<div class="modal-bg" id="modalBg">
  <div class="modal">
    <div class="modal-head">
      <h3>Detail Pertandingan</h3>
      <button class="modal-close" id="modalClose">×</button>
    </div>
    <div class="modal-body" id="modalBody"></div>
  </div>
</div>

<script>
  const WORKER_URL = "https://bola-api.rehantobing31.workers.dev";
  const REFRESH_INTERVAL = 30000;
  let allMatches = [];
  let currentFilter = "all";
  let currentSearch = "";

  function getInitials(name) {
    if (!name) return "?";
    const words = name.trim().split(/\s+/);
    if (words.length === 1) return words[0].substring(0, 2).toUpperCase();
    return (words[0][0] + words[1][0]).toUpperCase();
  }

  function teamLogoHtml(name, logoUrl, size) {
    const sizeStyle = size === "big" ? 'style="width:46px;height:46px;font-size:15px;"' : '';
    if (logoUrl) {
      return '<img class="' + (size === "big" ? "logo" : "logo") + '" src="' + logoUrl + '" alt="" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';"><div class="logo-fallback" style="display:none;' + (size === "big" ? 'width:46px;height:46px;font-size:15px;' : '') + '">' + getInitials(name) + '</div>';
    }
    return '<div class="logo-fallback" ' + sizeStyle + '>' + getInitials(name) + '</div>';
  }

  function formatTime(kickoff) {
    if (!kickoff) return { time: "-", date: "" };
    const parts = kickoff.split(",");
    if (parts.length < 2) return { time: kickoff, date: "" };
    return { time: parts[1].trim(), date: parts[0].trim() };
  }

  // Prediksi skor integer 0-4
  function predScore(match) {
    const seed = (match.id || 0) % 1000;
    return (seed % 4) + " - " + ((seed * 7) % 4);
  }

  // HDP / Voor format Asia
  function hdp(match) {
    const seed = (match.id || 0) % 100;
    const options = [
      "0 : 1/2", "1/2 : 0", "0 : 3/4", "3/4 : 0",
      "1/4 : 0", "0 : 1/4", "1/2 : 1", "1 : 1/2",
      "0 : 1", "1 : 0", "3/4 : 1", "1 : 3/4",
      "0 : 1 1/4", "1 1/4 : 0", "0 : 1 1/2", "1 1/2 : 0"
    ];
    return "HDP " + options[seed % options.length];
  }

  function filterMatches() {
    let result = allMatches;
    if (currentFilter !== "all") {
      result = result.filter(function(m) { return m.status === currentFilter; });
    }
    if (currentSearch) {
      const q = currentSearch.toLowerCase();
      result = result.filter(function(m) {
        return m.home_team.toLowerCase().indexOf(q) !== -1 ||
               m.away_team.toLowerCase().indexOf(q) !== -1 ||
               m.league.toLowerCase().indexOf(q) !== -1;
      });
    }
    return result;
  }

  function renderHot() {
    const hotScroll = document.getElementById("hotScroll");
    const hot = allMatches.slice(0, 8);

    if (hot.length === 0) {
      hotScroll.innerHTML = '<div class="empty">Belum ada pertandingan.</div>';
      return;
    }

    let html = "";
    hot.forEach(function(m) {
      const t = formatTime(m.kickoff);
      const isLive = m.status === "LIVE";
      html += '<div class="match-card" data-id="' + m.id + '">';
      html += '<div class="mc-top">';
      html += '<span>' + t.date + ' • ' + t.time + '</span>';
      html += '<span class="hdp-badge">' + hdp(m) + '</span>';
      html += '</div>';
      html += '<div class="mc-league">' + m.league + '</div>';
      html += '<div class="mc-teams">';
      html += '<div class="mc-team">' + teamLogoHtml(m.home_team, m.home_logo) + '<div class="name">' + m.home_team + '</div></div>';
      html += '<div class="mc-vs">VS</div>';
      html += '<div class="mc-team">' + teamLogoHtml(m.away_team, m.away_logo) + '<div class="name">' + m.away_team + '</div></div>';
      html += '</div>';
      html += '<div class="mc-pred">';
      html += '<span class="mc-pred-label">Prediksi Skor</span>';
      if (m.score) {
        html += '<span class="mc-pred-score live">' + m.score + '</span>';
      } else {
        html += '<span class="mc-pred-score">' + predScore(m) + '</span>';
      }
      html += '</div>';
      html += '</div>';
    });
    hotScroll.innerHTML = html;

    hotScroll.querySelectorAll(".match-card").forEach(function(card) {
      card.addEventListener("click", function() {
        const id = parseInt(card.getAttribute("data-id"));
        const m = allMatches.find(function(x) { return x.id === id; });
        if (m) openModal(m);
      });
    });
  }

  function renderList() {
    const listWrap = document.getElementById("listWrap");
    const matches = filterMatches();

    if (matches.length === 0) {
      listWrap.innerHTML = '<div class="empty">Belum ada pertandingan.</div>';
      return;
    }

    const groups = {};
    matches.forEach(function(m) {
      if (!groups[m.league]) groups[m.league] = [];
      groups[m.league].push(m);
    });

    let html = "";
    Object.keys(groups).sort().forEach(function(leagueName) {
      html += '<div class="league-group">';
      html += '<div class="league-title"><span>⚽ ' + leagueName + '</span><span>' + groups[leagueName].length + ' Match</span></div>';
      groups[leagueName].forEach(function(m) {
        const t = formatTime(m.kickoff);
        const isLive = m.status === "LIVE";
        const isFT = m.status === "FT";

        html += '<div class="match-row" data-id="' + m.id + '">';
        html += '<div class="mr-time ' + (isLive ? "live" : "") + '">';
        if (isLive) {
          html += '<div class="time">LIVE</div>';
        } else if (isFT) {
          html += '<div class="time">FT</div>';
        } else {
          html += '<div class="time">' + t.time + '</div>';
        }
        html += '<div class="date">' + t.date + '</div>';
        html += '</div>';

        html += '<div class="mr-teams">';
        html += '<div class="mr-team">' + teamLogoHtml(m.home_team, m.home_logo) + '<span class="name">' + m.home_team + '</span></div>';
        html += '<div class="mr-team">' + teamLogoHtml(m.away_team, m.away_logo) + '<span class="name">' + m.away_team + '</span></div>';
        html += '</div>';

        html += '<div class="mr-score">';
        if (m.score) {
          const parts = m.score.split(" - ");
          html += '<div class="line ' + (isLive ? "live" : "") + '">' + parts[0] + '</div>';
          html += '<div class="line ' + (isLive ? "live" : "") + '">' + parts[1] + '</div>';
        } else {
          html += '<div class="line empty">-</div>';
          html += '<div class="line empty">-</div>';
        }
        html += '</div>';
        html += '</div>';
      });
      html += '</div>';
    });

    listWrap.innerHTML = html;

    listWrap.querySelectorAll(".match-row").forEach(function(row) {
      row.addEventListener("click", function() {
        const id = parseInt(row.getAttribute("data-id"));
        const m = allMatches.find(function(x) { return x.id === id; });
        if (m) openModal(m);
      });
    });
  }

  function openModal(m) {
    const body = document.getElementById("modalBody");
    const t = formatTime(m.kickoff);
    let html = '';
    html += '<div class="modal-league">' + m.league + '</div>';
    html += '<div class="modal-teams">';
    html += '<div class="modal-team">' + teamLogoHtml(m.home_team, m.home_logo, "big") + '<div class="name">' + m.home_team + '</div></div>';
    html += '<div class="modal-vs">VS</div>';
    html += '<div class="modal-team">' + teamLogoHtml(m.away_team, m.away_logo, "big") + '<div class="name">' + m.away_team + '</div></div>';
    html += '</div>';
    html += '<div class="modal-info">';
    html += '<div class="modal-info-row"><span class="label">Tanggal</span><span class="value">' + t.date + '</span></div>';
    html += '<div class="modal-info-row"><span class="label">Jam</span><span class="value">' + t.time + ' WIB</span></div>';
    html += '<div class="modal-info-row"><span class="label">Status</span><span class="value">' + m.status + '</span></div>';
    if (m.score) {
      html += '<div class="modal-info-row"><span class="label">Skor</span><span class="value">' + m.score + '</span></div>';
    }
    html += '</div>';
    html += '<div class="modal-info">';
    html += '<div class="modal-info-row"><span class="label">🔮 Prediksi Skor</span><span class="value">' + predScore(m) + '</span></div>';
    html += '<div class="modal-info-row"><span class="label">📊 Pasaran</span><span class="value">' + hdp(m) + '</span></div>';
    html += '</div>';
    body.innerHTML = html;
    document.getElementById("modalBg").classList.add("show");
  }

  async function loadMatches() {
    try {
      const res = await fetch(WORKER_URL + "?t=" + Date.now());
      const data = await res.json();

      if (data.error) {
        document.getElementById("listWrap").innerHTML = '<div class="error">⚠️ ' + data.error + '</div>';
        return;
      }

      allMatches = data.matches || [];

      const leagues = new Set(allMatches.map(function(m) { return m.league; }));
      document.getElementById("statMatches").textContent = allMatches.length;
      document.getElementById("statPrediksi").textContent = allMatches.length;
      document.getElementById("statLeagues").textContent = leagues.size;

      renderHot();
      renderList();

      const now = new Date();
      document.getElementById("lastUpdate").textContent = "Update terakhir: " + now.toLocaleTimeString('id-ID');
    } catch (error) {
      document.getElementById("listWrap").innerHTML = '<div class="error">⚠️ Gagal memuat: ' + error.message + '</div>';
    }
  }

  document.getElementById("searchInput").addEventListener("input", function(e) {
    currentSearch = e.target.value;
    renderList();
  });

  document.querySelectorAll(".filter-btn").forEach(function(btn) {
    btn.addEventListener("click", function() {
      document.querySelectorAll(".filter-btn").forEach(function(b) { b.classList.remove("active"); });
      btn.classList.add("active");
      currentFilter = btn.getAttribute("data-filter");
      renderList();
    });
  });

  document.getElementById("btnRefresh").addEventListener("click", function() {
    const btn = document.getElementById("btnRefresh");
    btn.style.transform = "rotate(360deg)";
    btn.style.transition = "transform 0.5s";
    loadMatches().then(function() {
      setTimeout(function() { btn.style.transform = ""; }, 500);
    });
  });

  document.getElementById("btnTheme").addEventListener("click", function() {
    document.body.classList.toggle("light");
    const isLight = document.body.classList.contains("light");
    document.getElementById("btnTheme").textContent = isLight ? "☀️" : "🌙";
    localStorage.setItem("theme", isLight ? "light" : "dark");
  });

  if (localStorage.getItem("theme") === "light") {
    document.body.classList.add("light");
    document.getElementById("btnTheme").textContent = "☀️";
  }

  document.getElementById("modalClose").addEventListener("click", function() {
    document.getElementById("modalBg").classList.remove("show");
  });
  document.getElementById("modalBg").addEventListener("click", function(e) {
    if (e.target.id === "modalBg") {
      document.getElementById("modalBg").classList.remove("show");
    }
  });

  loadMatches();
  setInterval(loadMatches, REFRESH_INTERVAL);
</script>
</body>
</html>
