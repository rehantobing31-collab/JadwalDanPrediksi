<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>JadwalBolaPrediksi - Live Score & Prediksi Bola</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root {
    --bg: #0a0606;
    --bg-card: #141010;
    --bg-card-hover: #1e1616;
    --red: #ff3b30;
    --orange: #ff9500;
    --green: #22c55e;
    --text: #f5f0eb;
    --text-dim: #8a7f7a;
    --border: #2a1f1f;
  }
  html { scroll-behavior: smooth; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
    background: var(--bg);
    color: var(--text);
    min-height: 100vh;
    line-height: 1.5;
  }
  .header {
    background: linear-gradient(180deg, #1a0f0f 0%, var(--bg) 100%);
    border-bottom: 1px solid var(--border);
    padding: 14px 20px;
    position: sticky; top: 0; z-index: 100;
    backdrop-filter: blur(10px);
  }
  .header-inner {
    max-width: 1400px; margin: 0 auto;
    display: flex; justify-content: space-between; align-items: center;
    gap: 16px; flex-wrap: wrap;
  }
  .brand { display: flex; align-items: center; gap: 10px; }
  .brand-logo { width: 38px; height: 38px; }
  .brand-text h1 { font-size: 17px; font-weight: 800; line-height: 1.1; }
  .brand-text p { font-size: 10px; color: var(--text-dim); margin-top: 2px; }
  .live-indicator {
    display: flex; align-items: center; gap: 6px;
    background: rgba(34,197,94,0.1);
    border: 1px solid rgba(34,197,94,0.3);
    padding: 5px 12px; border-radius: 20px;
    font-size: 11px; font-weight: 700; color: var(--green);
  }
  .live-dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--green);
    animation: pulse-live 1.5s infinite;
  }
  @keyframes pulse-live {
    0%, 100% { opacity: 1; transform: scale(1); }
    50% { opacity: 0.5; transform: scale(1.2); }
  }
  .container { max-width: 1400px; margin: 0 auto; padding: 20px; }
  .hero {
    background: linear-gradient(135deg, #2a0f0f 0%, #1a0a0a 100%);
    border: 1px solid #3a1f1f;
    border-radius: 18px;
    padding: 24px 26px;
    margin-bottom: 20px;
    position: relative; overflow: hidden;
  }
  .hero::before {
    content: '';
    position: absolute; top: -50%; right: -10%;
    width: 280px; height: 280px;
    background: radial-gradient(circle, rgba(255,59,48,0.18) 0%, transparent 70%);
    border-radius: 50%;
  }
  .hero-label {
    display: inline-block;
    background: rgba(255,149,0,0.15);
    color: var(--orange);
    font-size: 10px; font-weight: 700;
    padding: 4px 10px; border-radius: 20px;
    letter-spacing: 0.5px; margin-bottom: 10px;
  }
  .hero h2 { font-size: 26px; font-weight: 800; margin-bottom: 6px; position: relative; }
  .hero h2 span {
    background: linear-gradient(135deg, var(--red), var(--orange));
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
  }
  .hero p { color: var(--text-dim); font-size: 13px; max-width: 550px; position: relative; }
  .hero-stats { display: flex; gap: 10px; margin-top: 18px; flex-wrap: wrap; position: relative; }
  .stat {
    background: rgba(255,255,255,0.05);
    border: 1px solid var(--border);
    border-radius: 10px; padding: 8px 14px;
    display: flex; align-items: center; gap: 8px;
  }
  .stat-icon { font-size: 14px; }
  .stat-num { font-size: 15px; font-weight: 800; color: var(--red); }
  .stat-label { font-size: 11px; color: var(--text-dim); }
  .search-wrap {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 10px 16px;
    margin-bottom: 20px;
    display: flex; align-items: center; gap: 10px;
  }
  .search-wrap svg { width: 18px; height: 18px; fill: var(--text-dim); flex-shrink: 0; }
  .search-wrap input {
    background: none; border: none; outline: none;
    color: var(--text); font-size: 14px; width: 100%;
  }
  .search-wrap input::placeholder { color: var(--text-dim); }
  .grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
  }
  @media (max-width: 900px) {
    .grid { grid-template-columns: 1fr; }
  }
  .col {
    background: var(--bg-card);
    border: 1px solid var(--border);
    border-radius: 16px;
    overflow: hidden;
  }
  .col-header {
    padding: 14px 18px;
    border-bottom: 1px solid var(--border);
    display: flex; justify-content: space-between; align-items: center;
    background: rgba(255,59,48,0.04);
  }
  .col-header h3 { font-size: 14px; font-weight: 800; color: var(--orange); }
  .col-header .count {
    background: rgba(255,59,48,0.15);
    color: var(--red);
    padding: 3px 10px; border-radius: 20px;
    font-size: 11px; font-weight: 700;
  }
  .col-body { max-height: 700px; overflow-y: auto; }
  .col-body::-webkit-scrollbar { width: 6px; }
  .col-body::-webkit-scrollbar-thumb { background: var(--red); border-radius: 3px; }
  .league-group { border-bottom: 1px solid var(--border); }
  .league-group:last-child { border-bottom: none; }
  .league-title {
    padding: 10px 18px;
    background: rgba(255,255,255,0.02);
    font-size: 11px; font-weight: 800;
    color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.5px;
    display: flex; justify-content: space-between; align-items: center;
  }
  .match-row {
    padding: 12px 18px;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    display: flex; align-items: center; gap: 12px;
    transition: background 0.2s;
  }
  .match-row:hover { background: var(--bg-card-hover); }
  .match-row:last-child { border-bottom: none; }
  .match-time-box {
    min-width: 48px; text-align: center; flex-shrink: 0;
  }
  .match-time-box .time {
    font-size: 12px; font-weight: 700; color: var(--text);
  }
  .match-time-box .date {
    font-size: 10px; color: var(--text-dim); margin-top: 2px;
  }
  .match-time-box.live .time { color: var(--red); }
  .match-time-box.live .date { color: var(--red); font-weight: 700; }
  .match-teams-col {
    flex: 1; display: flex; flex-direction: column; gap: 6px; min-width: 0;
  }
  .match-team-row {
    display: flex; align-items: center; gap: 8px; min-width: 0;
  }
  .match-team-row .logo {
    width: 20px; height: 20px; border-radius: 50%;
    background: #fff; object-fit: contain; flex-shrink: 0; padding: 1px;
  }
  .match-team-row .logo-fallback {
    width: 20px; height: 20px; border-radius: 50%;
    background: linear-gradient(135deg, var(--red), var(--orange));
    display: flex; align-items: center; justify-content: center;
    font-size: 8px; font-weight: 800; color: white; flex-shrink: 0;
  }
  .match-team-row .name {
    font-size: 13px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .match-score-box {
    min-width: 40px; text-align: right; flex-shrink: 0;
    display: flex; flex-direction: column; gap: 6px;
  }
  .score-line { font-size: 14px; font-weight: 800; color: var(--text); }
  .score-line.live { color: var(--red); }
  .score-line.empty { color: var(--text-dim); font-size: 12px; }
  .pred-row {
    padding: 12px 18px;
    border-bottom: 1px solid rgba(255,255,255,0.03);
    display: flex; align-items: center; gap: 12px;
  }
  .pred-row:last-child { border-bottom: none; }
  .pred-teams { flex: 1; min-width: 0; }
  .pred-team {
    font-size: 12px; font-weight: 600;
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    margin-bottom: 3px;
  }
  .pred-team:last-child { margin-bottom: 0; }
  .pred-score-box {
    display: flex; align-items: center; gap: 6px; flex-shrink: 0;
  }
  .pred-score {
    background: linear-gradient(135deg, var(--red), var(--orange));
    color: white; padding: 5px 10px; border-radius: 8px;
    font-size: 12px; font-weight: 800; letter-spacing: 0.5px;
  }
  .pred-label {
    font-size: 9px; color: var(--text-dim);
    text-transform: uppercase; letter-spacing: 0.3px; text-align: right;
  }
  .loading {
    text-align: center; padding: 50px 20px;
    color: var(--text-dim); font-size: 13px;
  }
  .spinner {
    width: 32px; height: 32px;
    border: 3px solid var(--border); border-top-color: var(--red);
    border-radius: 50%; animation: spin 1s linear infinite;
    margin: 0 auto 14px;
  }
  @keyframes spin { to { transform: rotate(360deg); } }
  .error {
    background: rgba(255,59,48,0.1); border: 1px solid var(--red);
    color: var(--red); padding: 14px; border-radius: 10px;
    text-align: center; font-size: 13px; margin: 20px;
  }
  .empty {
    text-align: center; padding: 40px 20px;
    color: var(--text-dim); font-size: 13px;
  }
  .last-update {
    text-align: center; color: var(--text-dim);
    font-size: 11px; padding: 16px 0 8px;
  }
</style>
</head>
<body>

<div class="header">
  <div class="header-inner">
    <div class="brand">
      <svg class="brand-logo" viewBox="0 0 100 100" xmlns="http://www.w3.org/2000/svg">
        <defs>
          <linearGradient id="g1" x1="0%" y1="0%" x2="100%" y2="100%">
            <stop offset="0%" stop-color="#ff3b30"/>
            <stop offset="100%" stop-color="#ff9500"/>
          </linearGradient>
        </defs>
        <circle cx="50" cy="50" r="45" fill="url(#g1)"/>
        <circle cx="50" cy="50" r="30" fill="none" stroke="white" stroke-width="3" opacity="0.3"/>
        <path d="M50 20 L60 40 L80 40 L65 55 L70 75 L50 62 L30 75 L35 55 L20 40 L40 40 Z" fill="white"/>
      </svg>
      <div class="brand-text">
        <h1>JadwalBolaPrediksi</h1>
        <p>Live Score & Prediksi Bola</p>
      </div>
    </div>
    <div class="live-indicator">
      <span class="live-dot"></span>
      <span>LIVE UPDATE</span>
    </div>
  </div>
</div>

<div class="container">
  <div class="hero">
    <div class="hero-label">⚡ UPDATE HARI INI</div>
    <h2>Jadwal & Prediksi <span>Bola Terbaru</span></h2>
    <p>Live score, jadwal pertandingan, dan prediksi skor dari berbagai liga dunia.</p>
    <div class="hero-stats">
      <div class="stat"><span class="stat-icon">📅</span><span class="stat-num" id="statMatches">-</span><span class="stat-label">Jadwal</span></div>
      <div class="stat"><span class="stat-icon">🏆</span><span class="stat-num" id="statLeagues">-</span><span class="stat-label">Liga</span></div>
      <div class="stat"><span class="stat-icon">🔴</span><span class="stat-num" id="statLive">-</span><span class="stat-label">Live</span></div>
    </div>
  </div>

  <div class="search-wrap">
    <svg viewBox="0 0 24 24"><path d="M15.5 14h-.79l-.28-.27C15.41 12.59 16 11.11 16 9.5 16 5.91 13.09 3 9.5 3S3 5.91 3 9.5 5.91 16 9.5 16c1.61 0 3.09-.59 4.23-1.57l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0C7.01 14 5 11.99 5 9.5S7.01 5 9.5 5 14 7.01 14 9.5 11.99 14 9.5 14z"/></svg>
    <input type="text" id="searchInput" placeholder="Cari nama tim atau liga...">
  </div>

  <div class="grid">
    <div class="col">
      <div class="col-header">
        <h3>📅 JADWAL BOLA</h3>
        <span class="count" id="countJadwal">0 Match</span>
      </div>
      <div class="col-body" id="jadwalBody">
        <div class="loading"><div class="spinner"></div>Memuat jadwal...</div>
      </div>
    </div>

    <div class="col">
      <div class="col-header">
        <h3>🔮 PREDIKSI SKOR</h3>
        <span class="count" id="countPrediksi">0 Match</span>
      </div>
      <div class="col-body" id="prediksiBody">
        <div class="loading"><div class="spinner"></div>Memuat prediksi...</div>
      </div>
    </div>
  </div>

  <div class="last-update" id="lastUpdate"></div>
</div>

<script>
  const WORKER_URL = "https://bola-api.rehantobing31.workers.dev";
  const REFRESH_INTERVAL = 30000;
  let allMatches = [];

  function getInitials(name) {
    if (!name) return "?";
    const words = name.trim().split(/\s+/);
    if (words.length === 1) return words[0].substring(0, 2).toUpperCase();
    return (words[0][0] + words[1][0]).toUpperCase();
  }

  function teamLogoHtml(name, logoUrl) {
    if (logoUrl) {
      return '<img class="logo" src="' + logoUrl + '" alt="" onerror="this.style.display=\'none\';this.nextElementSibling.style.display=\'flex\';"><div class="logo-fallback" style="display:none;">' + getInitials(name) + '</div>';
    }
    return '<div class="logo-fallback">' + getInitials(name) + '</div>';
  }

  function formatTime(kickoff) {
    if (!kickoff) return { time: "-", date: "" };
    const parts = kickoff.split(",");
    if (parts.length < 2) return { time: kickoff, date: "" };
    return { time: parts[1].trim(), date: parts[0].trim() };
  }

  function renderMatches(matches) {
    const jadwalBody = document.getElementById("jadwalBody");
    const prediksiBody = document.getElementById("prediksiBody");

    if (!matches || matches.length === 0) {
      jadwalBody.innerHTML = '<div class="empty">Belum ada pertandingan minggu ini.</div>';
      prediksiBody.innerHTML = '<div class="empty">Belum ada prediksi.</div>';
      return;
    }

    const leagues = new Set(matches.map(m => m.league));
    const liveCount = matches.filter(m => m.status === "LIVE").length;
    document.getElementById("statMatches").textContent = matches.length;
    document.getElementById("statLeagues").textContent = leagues.size;
    document.getElementById("statLive").textContent = liveCount;
    document.getElementById("countJadwal").textContent = matches.length + " Match";
    document.getElementById("countPrediksi").textContent = matches.length + " Match";

    const groups = {};
    matches.forEach(m => {
      if (!groups[m.league]) groups[m.league] = [];
      groups[m.league].push(m);
    });

    let jadwalHtml = "";
    Object.keys(groups).sort().forEach(leagueName => {
      jadwalHtml += '<div class="league-group">';
      jadwalHtml += '<div class="league-title"><span>⚽ ' + leagueName + '</span><span>' + groups[leagueName].length + '</span></div>';
      groups[leagueName].forEach(m => {
        const t = formatTime(m.kickoff);
        const isLive = m.status === "LIVE";
        const isFT = m.status === "FT";

        jadwalHtml += '<div class="match-row">';
        jadwalHtml += '<div class="match-time-box ' + (isLive ? "live" : "") + '">';
        if (isLive) {
          jadwalHtml += '<div class="time">LIVE</div>';
          jadwalHtml += '<div class="date">' + t.date + '</div>';
        } else if (isFT) {
          jadwalHtml += '<div class="time">FT</div>';
          jadwalHtml += '<div class="date">' + t.date + '</div>';
        } else {
          jadwalHtml += '<div class="time">' + t.time + '</div>';
          jadwalHtml += '<div class="date">' + t.date + '</div>';
        }
        jadwalHtml += '</div>';

        jadwalHtml += '<div class="match-teams-col">';
        jadwalHtml += '<div class="match-team-row">' + teamLogoHtml(m.home_team, m.home_logo) + '<span class="name">' + m.home_team + '</span></div>';
        jadwalHtml += '<div class="match-team-row">' + teamLogoHtml(m.away_team, m.away_logo) + '<span class="name">' + m.away_team + '</span></div>';
        jadwalHtml += '</div>';

        jadwalHtml += '<div class="match-score-box">';
        if (m.score) {
          const parts = m.score.split(" - ");
          jadwalHtml += '<div class="score-line ' + (isLive ? "live" : "") + '">' + parts[0] + '</div>';
          jadwalHtml += '<div class="score-line ' + (isLive ? "live" : "") + '">' + parts[1] + '</div>';
        } else {
          jadwalHtml += '<div class="score-line empty">-</div>';
          jadwalHtml += '<div class="score-line empty">-</div>';
        }
        jadwalHtml += '</div>';
        jadwalHtml += '</div>';
      });
      jadwalHtml += '</div>';
    });

    jadwalBody.innerHTML = jadwalHtml;

    let predHtml = "";
    Object.keys(groups).sort().forEach(leagueName => {
      predHtml += '<div class="league-group">';
      predHtml += '<div class="league-title"><span>⚽ ' + leagueName + '</span><span>' + groups[leagueName].length + '</span></div>';
      groups[leagueName].forEach(m => {
        const t = formatTime(m.kickoff);
        const homeGoals = (Math.random() * 2.5 + 0.5).toFixed(1);
        const awayGoals = (Math.random() * 2.5 + 0.5).toFixed(1);

        predHtml += '<div class="pred-row">';
        predHtml += '<div class="match-time-box">';
        predHtml += '<div class="time">' + t.time + '</div>';
        predHtml += '<div class="date">' + t.date + '</div>';
        predHtml += '</div>';
        predHtml += '<div class="pred-teams">';
        predHtml += '<div class="pred-team">' + m.home_team + '</div>';
        predHtml += '<div class="pred-team">' + m.away_team + '</div>';
        predHtml += '</div>';
        predHtml += '<div class="pred-score-box">';
        predHtml += '<div class="pred-label">Skor<br>Prediksi</div>';
        predHtml += '<div class="pred-score">' + homeGoals + ' - ' + awayGoals + '</div>';
        predHtml += '</div>';
        predHtml += '</div>';
      });
      predHtml += '</div>';
    });

    prediksiBody.innerHTML = predHtml;

    const now = new Date();
    document.getElementById("lastUpdate").textContent = "Update terakhir: " + now.toLocaleTimeString('id-ID');
  }

  function filterMatches(query) {
    if (!query) return allMatches;
    const q = query.toLowerCase();
    return allMatches.filter(m =>
      m.home_team.toLowerCase().includes(q) ||
      m.away_team.toLowerCase().includes(q) ||
      m.league.toLowerCase().includes(q)
    );
  }

  async function loadMatches() {
    try {
      const res = await fetch(WORKER_URL + "?t=" + Date.now());
      const data = await res.json();

      if (data.error) {
        document.getElementById("jadwalBody").innerHTML = '<div class="error">⚠️ ' + data.error + '</div>';
        document.getElementById("prediksiBody").innerHTML = '<div class="error">⚠️ ' + data.error + '</div>';
        return;
      }

      allMatches = data.matches || [];
      const query = document.getElementById("searchInput").value;
      renderMatches(filterMatches(query));
    } catch (error) {
      document.getElementById("jadwalBody").innerHTML = '<div class="error">⚠️ Gagal memuat: ' + error.message + '</div>';
      document.getElementById("prediksiBody").innerHTML = '<div class="error">⚠️ Gagal memuat.</div>';
    }
  }

  document.getElementById("searchInput").addEventListener("input", function(e) {
    renderMatches(filterMatches(e.target.value));
  });

  loadMatches();
  setInterval(loadMatches, REFRESH_INTERVAL);
</script>
</body>
</html>
